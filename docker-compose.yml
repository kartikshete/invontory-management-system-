version: '3.8'

services:
  # MongoDB database
  mongo:
    image: mongo:7
    container_name: innoventory-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: innoventory
    networks:
      - innoventory-network

  # Express API server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: innoventory-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/innoventory
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_secure_secret_in_production}
      JWT_EXPIRE: 7d
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongo
    networks:
      - innoventory-network

  # React frontend (Vite dev or Nginx for production)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: innoventory-client
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - server
    networks:
      - innoventory-network

volumes:
  mongo_data:

networks:
  innoventory-network:
    driver: bridge
